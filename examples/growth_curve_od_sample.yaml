id: calibration.optical-density.growth-curve.sample
name: Growth-curve OD calibration sample
version: 1
purpose: interactive calibration
parameters:
  sample_id: {type: string}
  od_led_intensity: {type: integer, minimum: 0, maximum: 255}
entry_step_id: {type: step, id: capture}
steps:
  - id: capture
    kind: action
    action: {type: action, id: capture_measurement, version: 1}
    parameters:
      metric: optical_density_raw
      sample_id: {parameter_ref: sample_id}
      od_led_intensity: {parameter_ref: od_led_intensity}
    timeout_polls: 30
    poll_interval_s: 1
  - id: record
    kind: action
    action: {type: action, id: request_observation, version: 1}
    parameters: {calibration_type: optical_density, sample_id: {parameter_ref: sample_id}}
    timeout_polls: 30
    poll_interval_s: 1
  - id: complete
    kind: complete
abort_actions:
  - {type: action, id: stop_activity, version: 1}
  - {type: action, id: stop_actuator, version: 1}
default_timeout: 600
metadata:
  calibration_type: optical_density
  observation_sink_id: edge.calibration_run.observation
  hardware_semantics: od_led_intensity_8_bit
