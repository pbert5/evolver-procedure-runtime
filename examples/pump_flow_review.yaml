id: calibration.pump-flow.review
name: Pump-flow calibration review
version: 1
purpose: interactive calibration
parameters:
  review_decision: {type: enum, values: [accept, reject]}
entry_step_id: {type: step, id: observe}
steps:
  - id: observe
    kind: action
    action: {type: action, id: request_observation, version: 1}
    parameters: {calibration_type: pump_flow_rate}
    timeout_polls: 30
    poll_interval_s: 1
  - id: collect-decision
    kind: input
    parameter: {type: parameter, id: review_decision}
    prompt: Accept or reject the pump-flow calibration evidence
    max_input_length: 16
  - id: record
    kind: action
    action: {type: action, id: emit_marker, version: 1}
    parameters: {calibration_type: pump_flow_rate, review_decision: {parameter_ref: review_decision}}
    timeout_polls: 30
    poll_interval_s: 1
  - id: complete
    kind: complete
abort_actions:
  - {type: action, id: stop_actuator, version: 1}
default_timeout: 600
metadata:
  calibration_type: pump_flow_rate
  observation_sink_id: central.calibration_session.observation
