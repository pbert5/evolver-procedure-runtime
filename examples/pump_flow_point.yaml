id: calibration.pump-flow.point
name: Pump-flow calibration point
version: 1
purpose: interactive calibration
parameters:
  pulse_duration_ms: {type: number, unit: millisecond, minimum: 1, maximum: 10000}
  delivered_volume_ul: {type: number, unit: microliter, minimum: 0, maximum: 100000}
entry_step_id: {type: step, id: pulse-once}
steps:
  - id: pulse-once
    kind: action
    action: {type: action, id: pulse_pump, version: 1}
    parameters: {duration_ms: {parameter_ref: pulse_duration_ms}, count: 1}
    timeout_polls: 30
    poll_interval_s: 1
  - id: record-volume
    kind: action
    action: {type: action, id: request_observation, version: 1}
    parameters:
      metric: delivered_volume_ul
      delivered_volume_ul: {parameter_ref: delivered_volume_ul}
    timeout_polls: 30
    poll_interval_s: 1
  - id: complete
    kind: complete
abort_actions:
  - {type: action, id: stop_actuator, version: 1}
default_timeout: 600
metadata:
  calibration_type: pump_flow_rate
  observation_sink_id: edge.calibration_run.observation
  hardware_semantics: bounded_single_pulse
