[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver-procedure-runtime"
version = "0.1.0"
description = "Session-local interactive procedure runtime for eVOLVER workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.8", "pytest-cov>=6"]

[tool.setuptools.packages.find]
include = ["evolver_procedure_runtime*"]

[tool.setuptools.package-data]
evolver_procedure_runtime = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
